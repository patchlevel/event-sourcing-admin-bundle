# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Assets"

on:
  pull_request:
  push:
    branches:
      - "[0-9]+.[0-9]+.x"
      - "renovate/*"

jobs:
  assets:
    name: "Assets"

    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install PHP"
        uses: "actions/setup-node@v4"
        with:
          node-version-file: ".nvmrc"

      - run: npm ci

      - run: npm run dev

      - run: git diff
